# toml input notes:
# dictionary keys are always interpreted as strings
# there’s no way to mark the end of a TOML table: all dictionaries/tables come after all other values

##############################
# Input paths and model years
##############################
protected_namespaces = '()'
debug_skims_and_paths = false
model_year = '2023'
base_year = '2023'
landuse_inputs = 'seacast_2023'
network_inputs = 'seacast_net_20250721'
db_name = 'soundcast_inputs_2023.db'
soundcast_inputs_dir = 'E:/projects/clients/SeaTac/GitHub/SeaCastScenarioInputs'
abm_model = 'daysim'

##############################
# Initial Setup
##############################
run_accessibility_calcs = true
run_setup_emme_project_folders = true
run_setup_emme_bank_folders = true
run_copy_scenario_inputs = true
run_import_networks = true

##############################
# Model Procedures
##############################
run_skims_and_paths_free_flow = true
run_skims_and_paths = true
run_truck_model = true
run_airport_model = true
run_supplemental_trips = true
run_daysim = true
run_daysim_popsampler = true
run_summaries = true

##############################
# Modes and Path Types
##############################
include_av = false
include_tnc = true
tnc_av = false    # TNCs (if available) are AVs
include_tnc_to_transit = false # AV to transit path type allowed
include_knr_to_transit = false # Kiss and Ride to Transit
include_delivery = false
include_telecommute = true

##############################
# Pricing
##############################
add_distance_pricing = false

##############################
# Airport Model Parameters
##############################
num_enplanements = 24894338
connecting = 7184927


##############################
# Other Controls
##############################
run_integrated = false
should_build_shadow_price = false
delete_banks = false
include_tnc_emissions = false

##############################
# Household Sampling Controls
##############################
households_persons_file = 'inputs/scenario/landuse/hh_and_persons.h5'
zone_district_file = 'inputs/model/daysim/lookup/hh_sampling_region_taz.csv' #input to generate taz_sample_rate_file below
taz_sample_rate_file = 'inputs/model/daysim/lookup/taz_sample_rate.txt' #intermediate output, input to popsampler script

#population sampling by districts - 3 options to choose from (each option is a column) - base case and two preferred sampling plans
# Popsampler - super/sub-sampling in population synthesis
sampling_option = 2 #1-3: five options available - each option is a column in pop_sample_district below

##############################
# Pricing
##############################
[distance_rate_dict]
am = 13.5
md = 8.5
pm = 13.5
ev = 8.5
ni = 8.5

##############################
# Household Sampling Controls
##############################

[pop_sample_district]
"City of SeaTac" = [1.0, 4.0, 2.0]
